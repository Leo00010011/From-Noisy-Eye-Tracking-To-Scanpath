# @package _global_
# Image-Feature Adaptation via Scanpath-Centroid Alignment Pretraining.
# Three ordered phases in one run on the precomputed frozen Mask2Former path:
#   1. ImageAdaptation — adapter trunk + align head only (centroid-alignment loss)
#   2. Combined        — encoder + decoder + heads, adapter frozen (fixation loss)
#   3. FullFinetune    — whole model incl. adapter, pixel decoder stays frozen (fixation loss)
defaults:
  - override /model/image_encoder: mask2former_precomputed

training:
  decisive_metric: "reg_error_val"
  pretrained_model: null
  # On: the model is used free-running at inference, and validate() then measures the
  # autoregressive reg_error_val (ratio 1 in eval) instead of the teacher-forced one.
  use_scheduled_sampling: true
  Phases: ["ImageAdaptation", "Combined", "FullFinetune"]
  ImageAdaptation:
    name: "ImageAdaptation"
    denoise_weight: 0
    decisive_metric: "align_error_val"
    epochs: 40
  Combined:
    name: "Combined"
    denoise_weight: 0
    decisive_metric: ${training.decisive_metric}
    epochs: 80
  FullFinetune:
    name: "FullFinetune"
    denoise_weight: 0
    decisive_metric: ${training.decisive_metric}
    epochs: 120

model:
  pretrained_encoder_path: null
  add_denoise_head: False
  image_adaptation:
    enabled: True
    centroid_cache_path: "data/Coco FreeView/scanpath_centroids.h5"
    align_head_hidden_dim: [256, 128]
    align_head_output_dropout: 0

loss:
  complex_type: "combined"
  fixation_loss_type: "separated_reg"
  align_loss_type: "l1"

data:
  load:
    use_precomputed_features: True

# The sampler steps on every batch from the start of the run (global epochs, all phases), so the
# warmup covers the whole ImageAdaptation phase (40) and the ramp starts with Combined:
#   epochs 0-40 teacher-forced | 40-100 ramp to max_prob (inside Combined) | 100-240 at max_prob.
# Invariant: warmup_epochs >= ImageAdaptation.epochs; warmup + active <= total epochs (240).
scheduled_sampling:
  warmup_epochs: 40
  active_epochs: 60
  n_updates: -1
  min_prob: 0
  max_prob: 0.85
