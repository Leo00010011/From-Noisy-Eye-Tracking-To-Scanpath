# @package _global_
# Final Training — best HP-search config #41 (Optuna trial 41).
# Full-budget, Combined-only, from-scratch recipe. Reports to W&B group "final training".
#
# Defaults below reproduce trial 41's schedule and effective regularisation for the first 30
# epochs, then extend the budget. Run as-is:
#   py train.py exp=final_c41 training.wandb.name=c41_w5_mp085
# Overriding scheduled_sampling.warmup_epochs breaks the trial-41 match — only do it deliberately.
# Round 2 (once the baseline is confirmed): flip max_prob to 1.0, e.g.
#   py train.py exp=final_c41 scheduled_sampling.max_prob=1.0 training.wandb.name=c41_w5_mp10
#
# Invariants (E == training.Combined.epochs == 430):
#   scheduler.warmup_steps + stable_steps + decay_steps == 430
#   scheduled_sampling.warmup_epochs + active_epochs      <= 430
training:
  decisive_metric: "reg_error_val"
  pretrained_model: null
  use_scheduled_sampling: true
  Phases: ["Combined"]
  num_epochs: 430                # E — keeps the one_cycle path consistent if ever used
  val_interval: 5
  weight_decay: 0.00009132348475718357   # trial 41
  Combined:
    name: "Combined"
    denoise_weight: 0
    decisive_metric: ${training.decisive_metric}
    epochs: 430                  # E
  wandb:
    enabled: true
    project: "noisy-eye-scanpath"
    entity: null
    mode: "online"
    group: "final training"
    name: null                   # set per run on the CLI, e.g. training.wandb.name=c41_w20_mp085

model:
  pretrained_encoder_path: null  # Combined from scratch (matches HP search)
  # --- trial 41 architecture + dropouts ---
  n_encoder: 2
  n_decoder: 2
  n_eye_decoder: 2
  src_dropout: 0.07595134675614718
  decoder_dropout: 0.06941358632470507
  eye_encoder_dropout: 0.3204373724016073
  eye_decoder_dropout: 0.0909400421995724
  image_features_dropout: 0.1728336416619316
  dur_head_dropout: 0.4483942049530059
  end_dropout: 0.23698082013143615
  reg_head_output_dropout: 0.3337788692605136
  denoise_head_output_dropout: 0.08615993560081492
  # --- restore the effective regularisation trial 41 was actually tuned under ---
  # The HP search predates bf92d75 and 4295f5b. At that point the fixation decoder's deformable
  # cross-attention silently applied `decoder_dropout` to its post-softmax sampling weights (the
  # eye decoder's did not), and the initial sampling offsets used the un-normalised star pattern.
  # Both are now explicit knobs; these values reproduce the code trial 41 was searched on.
  decoder_attn_dropout: 0.06941358632470507   # == decoder_dropout, as the pre-bf92d75 code did
  eye_decoder_attn_dropout: 0                 # eye decoder always passed 0 — unchanged
  normalize_grid_init: false                  # pre-4295f5b offset init

loss:
  cls_weight: 0.2326745678682372   # trial 41
  dur_weight: 0.08882518545315493  # trial 41

scheduler:
  # Matches trial 41 (warmup 5) for the first 30 epochs, then holds peak LR far longer before a
  # long decay instead of trial 41's 10-epoch decay at E=40.
  # NOTE: 5 + 200 + 100 == 305 < E == 430 is DELIBERATE, not a broken invariant. Training stalls
  # quickly at the peak LR, so the schedule is front-loaded and the remaining 125 epochs run at
  # min_lr. WarmupStableDecayScheduler caps `decay_step` at `decay_steps`, so past step 305 the
  # cosine term is exactly 0 and the LR sits flat at min_lr — verified, no wrap-around.
  # Do not "fix" the sum to 430; that would extend the peak-LR phase and change the run.
  warmup_steps: 5
  stable_steps: 200
  decay_steps: 100

scheduled_sampling:
  # Identical to trial 41 (5 / 25): prob steps to 0.09 at epoch 5, hits the 0.85 cap at ~26,
  # clamped from epoch 30. Do NOT override warmup_epochs on the CLI — that breaks the match.
  warmup_epochs: 5                 # 5 + 25 == 30 <= 430
  active_epochs: 25
  max_prob: 0.85                   # round 1; round 2 winner uses 1.0
