# @package _global_
# Final Training — best HP-search config #42 (Optuna trial 42).
# Full-budget, Combined-only, from-scratch recipe. Reports to W&B group "final training".
#
# Round 1 (this file, defaults below): max_prob=0.85, sweep scheduled_sampling.warmup_epochs.
#   py train.py exp=final_c42 scheduled_sampling.warmup_epochs=20 training.wandb.name=c42_w20_mp085
#   py train.py exp=final_c42 scheduled_sampling.warmup_epochs=50 training.wandb.name=c42_w50_mp085
# Round 2 (winner only): flip max_prob to 1.0, e.g.
#   py train.py exp=final_c42 scheduled_sampling.warmup_epochs=<best> scheduled_sampling.max_prob=1.0 training.wandb.name=c42_w<best>_mp10
#
# Invariants (E == training.Combined.epochs == 430):
#   scheduler.warmup_steps + stable_steps + decay_steps == 430
#   scheduled_sampling.warmup_epochs + active_epochs      <= 430
training:
  decisive_metric: "reg_error_val"
  pretrained_model: null
  use_scheduled_sampling: true
  Phases: ["Combined"]
  num_epochs: 430                # E — keeps the one_cycle path consistent if ever used
  val_interval: 5
  weight_decay: 0.00004739584301027366   # trial 42
  Combined:
    name: "Combined"
    denoise_weight: 0
    decisive_metric: ${training.decisive_metric}
    epochs: 430                  # E
  wandb:
    enabled: true
    project: "noisy-eye-scanpath"
    entity: null
    mode: "online"
    group: "final training"
    name: null                   # set per run on the CLI, e.g. training.wandb.name=c42_w20_mp085

model:
  pretrained_encoder_path: null  # Combined from scratch (matches HP search)
  # --- trial 42 architecture + dropouts ---
  n_encoder: 3
  n_decoder: 3
  n_eye_decoder: 2
  src_dropout: 0.060317935550300406
  decoder_dropout: 0.23038938401636289
  eye_encoder_dropout: 0.10316685920289624
  eye_decoder_dropout: 0.18213493052403773
  image_features_dropout: 0.25170863542742844
  dur_head_dropout: 0.34519741431468265
  end_dropout: 0.019656069920549468
  reg_head_output_dropout: 0.3997051994545213
  denoise_head_output_dropout: 0.3139501947454539

loss:
  cls_weight: 0.12767108035142832  # trial 42
  dur_weight: 0.8798996929014383   # trial 42

scheduler:
  warmup_steps: 30                 # 30 + 380 + 20 == 430 == E
  stable_steps: 380
  decay_steps: 20

scheduled_sampling:
  warmup_epochs: 20                # overridden per run: {20, 50}
  active_epochs: 50                # 50 + 50 == 100 <= 430
  max_prob: 0.85                   # round 1; round 2 winner uses 1.0
